<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Refuerzo intermitente — portada</title>
<link rel="stylesheet" href="css/reel.css">
<style>
  #cv .bub { position: absolute; left: var(--m); top: 462px; display: flex; align-items: center; gap: 26px; }
  #cv .bub .b { position: relative; width: 150px; height: 86px; border-radius: 43px; background: var(--ink2); }
  #cv .bub .b::after { content: ''; position: absolute; left: -9px; bottom: -7px; width: 23px; height: 23px; border-radius: 50%; background: var(--ink2); }
  #cv .bub .b i { position: absolute; top: 35px; width: 16px; height: 16px; border-radius: 50%; background: var(--bone); }
  #cv .bub .b i:nth-child(1) { left: 41px; opacity: .35; top: 37px; }
  #cv .bub .b i:nth-child(2) { left: 67px; opacity: .9; top: 29px; }
  #cv .bub .b i:nth-child(3) { left: 93px; opacity: .55; top: 34px; }
  #cv .bub span { font: 400 26px/1 var(--mono); color: var(--ash); }
  #cv .title { position: absolute; left: var(--m); top: 590px; font-size: 192px; line-height: .88; }
  #cv .title em { color: var(--red); }
  #cv .rule3 { position: absolute; left: var(--m); right: var(--m); top: 980px; height: 2px; background: var(--bone); opacity: .3; }
  #cv .sub { position: absolute; left: var(--m); top: 1020px; font-size: 84px; line-height: 1; }
  #cv .tags { position: absolute; left: var(--m); top: 1250px; font: 500 25px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: rgba(235,228,215,.7); display: flex; gap: 18px; align-items: center; }
  #cv .tags .sq { width: 14px; height: 14px; background: var(--red); display: inline-block; }
</style>
</head>
<body>
<div id="stage">
  <section class="scene dark" id="cv">
    <div class="bub"><div class="b"><i></i><i></i><i></i></div><span>escribiendo…</span></div>
    <h1 class="title display">Refuerzo<br><em>intermitente</em></h1>
    <div class="rule3"></div>
    <p class="sub display">Por qué engancha<br>lo que llega <em>a veces</em>.</p>
    <div class="tags"><b class="sq"></b>Vínculos sanos · vínculos con violencia</div>
    <div class="chrome on-dark">
      <div class="rh"><span>Refuerzo intermitente</span><span class="rh-r">Psicología</span></div><div class="rule"></div>
      <div class="handle">@lic.andreagarzon</div>
    </div>
  </section>
</div>
<script>
  // misma textura de papel que el reel
  function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
  (function(){
    const S=540,cv=document.createElement('canvas');cv.width=cv.height=S;const g=cv.getContext('2d'),rnd=mulberry32(71);
    const img=g.createImageData(S,S);for(let i=0;i<S*S;i++){const v=Math.pow(rnd(),7)*30;img.data[i*4]=img.data[i*4+1]=img.data[i*4+2]=v;img.data[i*4+3]=255;}
    g.putImageData(img,0,0);document.documentElement.style.setProperty('--paper-dark',`url(${cv.toDataURL('image/png')})`);
  })();
  document.fonts.ready.then(() => { window.__seek = () => {}; window.__ready = true; });
</script>
</body>
</html>
